services:
  - type: web
    name: digitalisasi-arsip-api
    env: docker
    rootDir: apps/api
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: Digitalisasi Arsip
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: arsip-db
          property: host
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        fromDatabase:
          name: arsip-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: arsip-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: arsip-db
          property: password
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: arsip-digital
      - key: R2_ENDPOINT
        value: https://08e44e04d01e29b617d800638417e785.r2.cloudflarestorage.com
      - key: R2_REGION
        value: auto
      - key: FILESYSTEM_DISK
        value: r2

databases:
  - name: arsip-db
    plan: free
    databaseName: digitalisasi_arsip
