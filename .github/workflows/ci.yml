name: CI Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  dashboard-ci:
    name: Dashboard (Next.js) - Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Node Dependencies
        run: pnpm install

      - name: Check TypeScript Compilation
        run: pnpm check-types

      - name: Build Next.js Dashboard
        run: pnpm build

  api-ci:
    name: Backend API (Laravel) - Setup & Lint
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: digital_archive_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, json, openssl, ctype, tokenizer, xml
          coverage: none

      - name: Install Composer Dependencies
        working-directory: apps/api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy Environment Testing File
        working-directory: apps/api
        run: cp .env.example .env.testing

      - name: Generate Application Key
        working-directory: apps/api
        run: php artisan key:generate --env=testing

      - name: Run Database Migrations
        working-directory: apps/api
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: digital_archive_testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan migrate --force --env=testing
